
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TerminalHackPro — Download</title>
    <style>
        /* ─── reset & base ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ─── ambient glow rings ─── */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffffff, transparent 70%);
            top: -15%;
            right: -10%;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #aaaaaa, transparent 70%);
            bottom: -15%;
            left: -10%;
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.15;
                transform: scale(0.9);
            }
            100% {
                opacity: 0.35;
                transform: scale(1.2);
            }
        }

        /* ─── card ─── */
        .card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: #111111;
            border-radius: 2.5rem;
            padding: 2.8rem 2.5rem 2.8rem;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(2px);
            transition: box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .card:hover {
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* ─── shine overlay ─── */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 2.5rem;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.25) 0%,
                    rgba(255, 255, 255, 0) 40%,
                    rgba(255, 255, 255, 0) 60%,
                    rgba(255, 255, 255, 0.10) 100%);
            pointer-events: none;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* ─── header ─── */
        .badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #888;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 1.8rem;
            backdrop-filter: blur(4px);
        }

        .badge span {
            color: #fff;
            font-weight: 700;
        }

        /* ─── icon area ─── */
        .icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .icon-ring {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 -1px 0 rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.4s ease, transform 0.4s ease;
        }

        .icon-ring:hover {
            transform: scale(1.02);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        /* shiny reflection on icon */
        .icon-ring::before {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 26px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 40%,
                    transparent 60%,
                    rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }

        .icon-ring svg {
            width: 56px;
            height: 56px;
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.08));
            position: relative;
            z-index: 1;
        }

        .icon-ring img{
            width: 85px;
            border-radius: 20%;
        }

        .icon-ring .shine-sparkle {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #000000 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.7;
            pointer-events: none;
            z-index: 2;
            animation: sparkle 3s ease-in-out infinite alternate;
        }

        @keyframes sparkle {
            0% {
                opacity: 0.3;
                transform: scale(0.8) translate(0, 0);
            }
            100% {
                opacity: 0.9;
                transform: scale(1.3) translate(-4px, -4px);
            }
        }

        /* ─── file info ─── */
        .file-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 0.2rem;
            word-break: break-word;
        }

        .file-name .highlight {
            background: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .file-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.3rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .file-meta .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #555;
        }

        .file-meta .size {
            color: #ccc;
            font-weight: 500;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .file-meta .size strong {
            color: #fff;
            font-weight: 600;
        }

        /* ─── divider ─── */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.08) 20%,
                    rgba(255, 255, 255, 0.08) 80%,
                    transparent);
            margin: 1.6rem 0 1.8rem;
        }

        /* ─── download button ─── */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            width: 100%;
            padding: 1.2rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0a0a0a;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 8px 30px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            letter-spacing: 0.01em;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 2rem;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.8) 0%,
                    rgba(255, 255, 255, 0) 50%,
                    rgba(255, 255, 255, 0.4) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .download-btn:hover::before {
            opacity: 1;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 16px 50px rgba(255, 255, 255, 0.12),
                0 0 60px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            background: linear-gradient(135deg, #ffffff 0%, #d8d8d8 100%);
        }

        .download-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.06);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0a0a0a;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .download-btn:hover svg {
            transform: translateY(2px);
        }

        .download-btn .btn-text {
            position: relative;
            z-index: 1;
        }

        /* ─── shiny accent on button ─── */
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 40%;
            height: 200%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            transform: rotate(20deg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease, left 0.8s ease;
        }

        .download-btn:hover::after {
            opacity: 1;
            left: 80%;
        }

        /* ─── footer note ─── */
        .footer-note {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.6rem;
        }

        .footer-note span {
            color: #777;
            font-weight: 400;
        }

        .footer-note .shimmer {
            display: inline-block;
            background: linear-gradient(90deg, #555, #aaa, #555);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
        }

        @keyframes shimmerText {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* ─── responsive ─── */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem 2rem;
                border-radius: 2rem;
            }
            .card::after {
                border-radius: 2rem;
            }
            .file-name {
                font-size: 1.3rem;
            }
            .icon-ring {
                width: 96px;
                height: 96px;
                border-radius: 22px;
            }
            .icon-ring::before {
                border-radius: 20px;
            }
            .icon-ring svg {
                width: 44px;
                height: 44px;
            }
            .download-btn {
                font-size: 1rem;
                padding: 1rem 1.4rem;
                gap: 0.7rem;
            }
            .badge {
                font-size: 0.5rem;
                padding: 0.3rem 0.8rem;
            }
            .file-meta {
                font-size: 0.75rem;
                gap: 0.5rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.5rem 1rem 1.5rem;
            }
            .file-name {
                font-size: 1.1rem;
            }
            .icon-ring {
                width: 80px;
                height: 80px;
                border-radius: 18px;
            }
            .icon-ring svg {
                width: 36px;
                height: 36px;
            }
        }

        /* ─── dark scrollbar (optional polish) ─── */
        ::-webkit-scrollbar {
            width: 6px;
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Download card">

        <!-- badge -->
        <div class="badge">
            ⚡ <span>premium</span> · secure
        </div>

        <!-- icon -->
        <div class="icon-wrap">
            <div class="icon-ring">
                <div class="shine-sparkle"></div>
                <!-- photo / file icon (JPG + APK hybrid) -->
                <img src="photo_2025-11-06_12-23-17.jpg">
            </div>
        </div>

        <!-- file name -->
        <h1 class="file-name">
            <span class="highlight">TerminalHackPro</span> <span style="color:#aaa;font-weight:400;">v1.2</span>
        </h1>

        <!-- meta -->
        <div class="file-meta">
            <span class="size"><strong>6.36</strong> MB</span>
            <span class="dot"></span>
            <span style="color:#999;">📦 APK</span>
        </div>

        <div class="divider"></div>

        <!-- DOWNLOAD BUTTON (href to APK) -->
        <a href="TerminalHackPro-v1.2.apk" class="download-btn" download>
            <svg viewBox="0 0 24 24">
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
                <polyline points="8 12 12 16 16 12" />
                <line x1="12" y1="2" x2="12" y2="16" />
            </svg>
            <span class="btn-text">Download APK</span>
        </a>

        <!-- footer -->
        <div class="footer-note">
            <span class="shimmer">✦ premium release ✦</span>
            <br />
            <span style="font-size:0.6rem;letter-spacing:0.08em;color:#444;text-transform:none;margin-top:0.3rem;display:inline-block;">
                SHA-256 verified · 100% clean
            </span>
        </div>

    </div>

    <!-- (optional) small script for extra shimmer on load -->
    <script>
        (function() {
            // subtle entrance animation
            const card = document.querySelector('.card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'opacity 0.7s ease, transform 0.7s ease';

            requestAnimationFrame(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            });

            // log download (optional)
            const btn = document.querySelector('.download-btn');
            btn.addEventListener('click', function(e) {
                // just a tiny beacon – no tracking, just feedback
                const text = this.querySelector('.btn-text');
                const original = text.textContent;
                text.textContent = '⬇ starting…';
                setTimeout(() => {
                    text.textContent = original;
                }, 1200);
            });
        })();
    </script>

</body>
</html>
